# Production deploys for the Next app are handled by Vercel Git integration on this repo
# (production branch: prod, root directory: frontend). No deploy secrets required in GitHub.
# This workflow gives fast feedback on frontend changes.
name: Frontend CI

on:
  push:
    branches: [prod, dev, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
